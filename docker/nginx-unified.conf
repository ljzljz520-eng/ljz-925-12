server {
    listen 3009;
    server_name localhost;

    # 日志
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # 前端PHP应用
    root /var/www/html;
    index index.php;

    # 禁用缓存（开发模式）
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    # Admin静态文件和路由
    location /admin/ {
        try_files $uri /admin/index.php?$query_string;
    }

    location = /admin {
        return 301 /admin/;
    }

    # 静态文件
    location /assets/ {
        alias /var/www/html/assets/;
    }

    # Admin API请求 - 由Admin api.php处理（代理到后端）
    location /api/admin/ {
        rewrite ^/api/admin/(.*)$ /admin/api.php last;
    }

    location = /api/admin {
        rewrite ^ /admin/api.php last;
    }

    # API请求 - 由前端api.php处理（代理到后端）
    location /api/ {
        rewrite ^/api/(.*)$ /api.php last;
    }

    # PHP处理 - 使用正则location，优先级高于前缀location
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        include fastcgi_params;
    }

    # 前端路由 - 最后匹配
    location / {
        try_files $uri /index.php?$query_string;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}
