[global]
error_log = /proc/self/fd/2

[www]
; Listen on all interfaces
listen = 9000

; User and group
user = www-data
group = www-data

; Process management
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Logging
access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no

