services:
  php-frontend:
    build:
      context: ..
      dockerfile: php-frontend/Dockerfile
    container_name: card-code-php-frontend
    ports:
      - "3002:80"
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    restart: unless-stopped
    networks:
      - card-code-network

networks:
  card-code-network:
    driver: bridge
